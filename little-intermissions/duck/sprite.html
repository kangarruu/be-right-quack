<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duck</title>
<style>
  html, body { margin: 0; width: 280px; height: 290px; background: transparent; overflow: hidden; position: relative;
    -webkit-user-select: none; user-select: none; cursor: default; }
  #sprite { position: absolute; left: 88px; bottom: 4px; width: 104px; height: 104px; overflow: visible; }
  svg * { transform-box: view-box; }

  #flip { transform-origin: 60px 60px; }
  body[data-dir="-1"] #flip { transform: scaleX(-1); }

  /* Base poses animate #root; one-off actions animate #act and the head, so the two never fight. */
  #root { transform-origin: 60px 110px; }
  #act { transform-origin: 60px 110px; }
  #head-pose { transform-origin: 82px 54px; transition: transform .35s ease; }
  #head-act { transform-origin: 82px 54px; }
  #wing { transform-origin: 76px 72px; transition: transform .3s ease; }
  #lower-beak { transform-origin: 99px 44px; transition: transform .2s ease; }
  .foot { transform-origin: 52px 104px; }
  #foot-b { transform-origin: 74px 104px; }
  #tail { transform-origin: 32px 70px; }

  .eye-closed, .zzz, .props, .hearts, .eye-wide, .eye-x, .stars { opacity: 0; transition: opacity .25s; }
  .eye-open { transition: opacity .25s; }

  /* nap: chin on chest, eyes shut, slow breathing */
  body[data-pose="nap"] #head-pose { transform: translate(-5px, 11px) rotate(24deg); }
  body[data-pose="nap"] .eye-open { opacity: 0; }
  body[data-pose="nap"] .eye-closed { opacity: 1; }
  body[data-pose="nap"] .zzz { opacity: 1; }
  body[data-pose="nap"] #root { animation: breathe 4.2s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, 1.04); } }
  .zzz text { font: italic 700 17px Georgia, serif; fill: #7d909a; }
  .zzz .z1 { animation: zrise 3.2s ease-in infinite; }
  .zzz .z2 { animation: zrise 3.2s ease-in 1.1s infinite; }
  @keyframes zrise { 0% { transform: translate(0, 6px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(8px, -16px); opacity: 0; } }

  /* awake and blinking */
  body[data-pose="idle"] #root, body[data-pose="sit"] #root, body[data-pose="focus"] #root { animation: idle-bob 3.6s ease-in-out infinite; }
  @keyframes idle-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
  .eye-open { animation: blink 5s infinite; transform-origin: 92px 34px; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }

  /* walk: waddle with alternating feet */
  body[data-pose="walk"] #root { animation: waddle .52s ease-in-out infinite; }
  @keyframes waddle { 0%, 100% { transform: rotate(-5deg) translateY(0); } 25% { transform: translateY(-2.5px); }
    50% { transform: rotate(5deg) translateY(0); } 75% { transform: translateY(-2.5px); } }
  body[data-pose="walk"] #foot-a { animation: step .52s ease-in-out infinite; }
  body[data-pose="walk"] #foot-b { animation: step .52s ease-in-out infinite .26s; }
  @keyframes step { 0%, 100% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(5px, -4px) rotate(-12deg); } }
  body[data-pose="walk"] #head-pose { transform: translate(2px, 2px) rotate(4deg); }
  body[data-pose="walk"] #tail { animation: tail-wag .26s ease-in-out infinite alternate; }
  @keyframes tail-wag { from { transform: rotate(-6deg); } to { transform: rotate(8deg); } }

  /* focus: the same calm stance, plus a headband whose tails stir. It is the pose for a focus sprint. */
  .band { opacity: 0; transition: opacity .25s; }
  body[data-pose="focus"] .band { opacity: 1; }
  .band-tails { transform-origin: 69.5px 31px; animation: band-flutter 2.2s ease-in-out infinite alternate; }
  @keyframes band-flutter { from { transform: rotate(-5deg); } to { transform: rotate(7deg); } }

  /* wave: raised wing asks for attention */
  body[data-pose="wave"] #wing { animation: wing-wave .5s ease-in-out infinite alternate; }
  @keyframes wing-wave { from { transform: rotate(38deg); } to { transform: rotate(62deg); } }
  body[data-pose="wave"] #head-pose { transform: translate(1px, -1px) rotate(-5deg); }
  body[data-pose="wave"] #root { animation: idle-bob 1.2s ease-in-out infinite; }

  /* carried: lifted by the scruff, feet dangle */
  body[data-pose="carried"] #root { animation: dangle 1s ease-in-out infinite; transform-origin: 60px 50px; }
  @keyframes dangle { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  body[data-pose="carried"] .eye-open { opacity: 0; }
  body[data-pose="carried"] .eye-wide { opacity: 1; }
  body[data-pose="carried"] #wing { transform: rotate(40deg); }
  body[data-pose="carried"] #lower-beak { transform: rotate(12deg); }
  body[data-pose="carried"] .foot { animation: kick .35s ease-in-out infinite alternate; }
  body[data-pose="carried"] #foot-b { animation-delay: .17s; }
  @keyframes kick { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }

  /* sit: temporary manager on duty */
  body[data-pose="sit"] .props { opacity: 1; }
  body[data-pose="sit"] #head-pose { transform: translate(0, 1px) rotate(-3deg); }

  /* proud: report time, wing up */
  body[data-pose="proud"] .props { opacity: 1; }
  body[data-pose="proud"] #wing { animation: wing-wave .7s ease-in-out infinite alternate; }
  body[data-pose="proud"] #head-pose { transform: translate(1px, -2px) rotate(-8deg); }
  body[data-pose="proud"] #root { animation: idle-bob 1.1s ease-in-out infinite; }

  /* one-off actions */
  body[data-act="hop"] #act { animation: hop .55s cubic-bezier(.3, .8, .4, 1) 2; }
  @keyframes hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 15% { transform: scale(1.07, .88); }
    50% { transform: translateY(-18px) scale(.96, 1.06); } 85% { transform: scale(1.06, .9); } }
  body[data-act="land"] #act { animation: land .5s ease-out; }
  @keyframes land { 0% { transform: scale(1.14, .72); } 45% { transform: scale(.94, 1.1); } 100% { transform: scale(1, 1); } }
  body[data-act="happy"] #act { animation: hop .5s cubic-bezier(.3, .8, .4, 1) 2; }
  body[data-act="happy"] .hearts { opacity: 1; }
  .hearts text { font: 700 12px Georgia, serif; fill: #e08a9b; }
  body[data-act="happy"] .hearts .h1 { animation: hrise 1.6s ease-out 1; }
  body[data-act="happy"] .hearts .h2 { animation: hrise 1.6s ease-out .25s 1; }
  @keyframes hrise { 0% { transform: translate(0, 8px) scale(.6); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(0, -22px) scale(1.1); opacity: 0; } }
  body[data-act="quack"] #head-act { animation: quack-head .7s ease-in-out 2; }
  body[data-act="quack"] #lower-beak { animation: quack-beak .35s ease-in-out 4; }
  @keyframes quack-head { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(3px, -2px) rotate(-4deg); } }
  @keyframes quack-beak { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(20deg); } }
  body[data-act="preen"] #head-act { animation: preen 2.6s ease-in-out; }
  @keyframes preen { 0%, 100% { transform: rotate(0); }
    14%, 30%, 46%, 62% { transform: translate(-10px, 12px) rotate(72deg); }
    22%, 38%, 54% { transform: translate(-10px, 12px) rotate(60deg); } 80% { transform: rotate(0); } }
  body[data-act="look"] #head-act { animation: look 2.8s ease-in-out; }
  @keyframes look { 0%, 100% { transform: rotate(0); } 20%, 35% { transform: rotate(-14deg) translate(-2px, 0); }
    55%, 75% { transform: rotate(10deg) translate(2px, 1px); } }
  body[data-act="yawn"] #lower-beak { animation: yawn-beak 2.4s ease-in-out; }
  body[data-act="yawn"] #head-act { animation: yawn-head 2.4s ease-in-out; }
  body[data-act="yawn"] .eye-open { opacity: 0; animation: none; }
  body[data-act="yawn"] .eye-closed { opacity: 1; }
  @keyframes yawn-beak { 0%, 100% { transform: rotate(0); } 25%, 65% { transform: rotate(34deg); } }
  @keyframes yawn-head { 0%, 100% { transform: rotate(0); } 25%, 65% { transform: rotate(-16deg) translate(0, -2px); } }
  body[data-act="wiggle"] #tail { animation: tail-wag .13s ease-in-out 12 alternate; }

  /* sneeze: squint, tip back, then snap forward */
  body[data-act="sneeze"] #head-act { animation: sneeze-head 1.8s ease-in-out; }
  body[data-act="sneeze"] #lower-beak { animation: sneeze-beak 1.8s ease-in-out; }
  body[data-act="sneeze"] .eye-open { opacity: 0; animation: none; }
  body[data-act="sneeze"] .eye-closed { opacity: 1; }
  @keyframes sneeze-head { 0% { transform: rotate(0); } 34%, 48% { transform: rotate(-17deg) translate(-1px, -3px); }
    54% { transform: rotate(16deg) translate(3px, 4px); } 64% { transform: rotate(13deg) translate(2px, 3px); }
    82%, 100% { transform: rotate(0); } }
  @keyframes sneeze-beak { 0%, 100% { transform: rotate(0); } 34%, 48% { transform: rotate(26deg); } 54% { transform: rotate(3deg); } }
  .spray circle { fill: #b4daee; stroke: #6fa8cb; stroke-width: .7; opacity: 0; }
  body[data-act="sneeze"] .spray circle { animation: spray 1.8s ease-out; }
  body[data-act="sneeze"] .spray .d2 { animation-delay: .03s; }
  body[data-act="sneeze"] .spray .d3 { animation-delay: .06s; }
  @keyframes spray { 0%, 52% { opacity: 0; transform: translate(0, 0); } 56% { opacity: 1; }
    80% { opacity: .9; } 100% { opacity: 0; transform: translate(17px, 11px); } }

  /* spin: a pirouette faked with a horizontal squash */
  body[data-act="spin"] #act { animation: spin .8s ease-in-out 2; }
  @keyframes spin { 0% { transform: scaleX(1); } 25% { transform: scaleX(.05) translateY(-4px); }
    50% { transform: scaleX(-1) translateY(-8px); } 75% { transform: scaleX(.05) translateY(-4px); } 100% { transform: scaleX(1); } }

  /* bow: a small, formal nod from the feet up */
  body[data-act="bow"] #act { animation: bow 1.9s ease-in-out; }
  body[data-act="bow"] #head-act { animation: bow-head 1.9s ease-in-out; }
  @keyframes bow { 0%, 100% { transform: rotate(0); } 25%, 65% { transform: rotate(24deg) translateY(2px); } }
  @keyframes bow-head { 0%, 100% { transform: rotate(0); } 25%, 65% { transform: rotate(14deg); } }

  /* shake: frantic jitter, wide eyes, open beak */
  body[data-act="shake"] #act { animation: shake .09s linear 14 alternate; }
  body[data-act="shake"] .eye-open { opacity: 0; }
  body[data-act="shake"] .eye-wide { opacity: 1; }
  body[data-act="shake"] #lower-beak { transform: rotate(22deg); }
  @keyframes shake { from { transform: translate(-2px, 0) rotate(-2deg); } to { transform: translate(2px, -1px) rotate(2deg); } }

  .flip-prop { opacity: 0; pointer-events: none; }
  #gag-wing { transform-origin: 68px 76px; }
  .gag-angry, .gag-relief { opacity: 0; }
  body[data-act="deskflip"] .eye-open, body[data-act="vasetoss"] .eye-open,
  body[data-act="chainsaw"] .eye-open { opacity: 0; animation: none; }
  body[data-act="deskflip"] .gag-angry, body[data-act="vasetoss"] .gag-angry,
  body[data-act="chainsaw"] .gag-angry { animation: gag-anger 2.6s steps(1, end); }
  body[data-act="deskflip"] .gag-relief, body[data-act="vasetoss"] .gag-relief,
  body[data-act="chainsaw"] .gag-relief { animation: gag-relief 2.6s steps(1, end); }
  body[data-act="deskflip"] #lower-beak, body[data-act="vasetoss"] #lower-beak,
  body[data-act="chainsaw"] #lower-beak { animation: gag-beak 2.6s steps(1, end); }
  @keyframes gag-anger { 0% { opacity: 1; } 62%, 100% { opacity: 0; } }
  @keyframes gag-relief { 0% { opacity: 0; } 62%, 100% { opacity: 1; } }
  @keyframes gag-beak { 0% { transform: rotate(27deg); } 62%, 100% { transform: rotate(0); } }
  body[data-act="deskflip"] #act { animation: throw-duck 2.6s ease-out; }
  body[data-act="deskflip"] #gag-wing { animation: throw-wing 2.6s ease-out; }
  body[data-act="deskflip"] #tiny-desk { animation: desk-flip 2.6s linear; transform-origin: 130px 96px; }
  body[data-act="deskflip"] #papers { animation: scatter 2.6s linear; }
  body[data-act="deskflip"] #desk-impact { animation: impact 2.6s linear; }
  body[data-act="vasetoss"] #act { animation: throw-duck 2.6s ease-out; }
  body[data-act="vasetoss"] #gag-wing { animation: throw-wing 2.6s ease-out; }
  body[data-act="vasetoss"] #vase { animation: vase-toss 2.6s linear; transform-origin: 111px 81px; }
  body[data-act="vasetoss"] #shards { animation: shatter 2.6s linear; }
  body[data-act="vasetoss"] #shards path { animation: shard-scatter 2.6s ease-out; }
  body[data-act="vasetoss"] #shards path:nth-child(2) { animation-name: shard-scatter-right; }
  body[data-act="vasetoss"] #shards path:nth-child(3) { animation-name: shard-scatter-far; }
  body[data-act="vasetoss"] #vase-impact { animation: impact 2.6s linear; }
  body[data-act="chainsaw"] #act { animation: saw-duck 2.6s linear; }
  body[data-act="chainsaw"] #gag-wing { animation: saw-wing 2.6s linear; }
  body[data-act="chainsaw"] #saw { animation: saw-cut 2.6s linear; transform-origin: 105px 79px; }
  body[data-act="chainsaw"] #desk-left { animation: cut-left 2.6s linear; transform-origin: 125px 102px; }
  body[data-act="chainsaw"] #desk-right { animation: cut-right 2.6s linear; transform-origin: 153px 102px; }
  body[data-act="chainsaw"] #chips-spray { animation: chips 2.6s linear; }
  @keyframes throw-duck {
    0%, 5%, 100% { transform: none; }
    13% { transform: translateX(-8px) rotate(-14deg) scale(.92, 1.08); }
    20% { transform: translate(12px, -5px) rotate(15deg) scale(1.1, .9); }
    28% { transform: translate(3px, 0) rotate(-4deg); }
    40%, 90% { transform: none; }
  }
  @keyframes throw-wing {
    0% { opacity: 0; }
    5%, 55% { opacity: 1; }
    13% { transform: rotate(26deg); }
    20%, 30% { transform: rotate(-35deg); }
    60%, 100% { opacity: 0; transform: none; }
  }
  @keyframes desk-flip {
    0%, 13% { opacity: 1; transform: none; }
    21% { opacity: 1; transform: translate(8px, -15px) rotate(75deg); }
    32% { opacity: 1; transform: translate(19px, -23px) rotate(145deg); }
    45%, 88% { opacity: 1; transform: translate(22px, -3px) rotate(180deg); }
    100% { opacity: 0; transform: translate(22px, -3px) rotate(180deg); }
  }
  @keyframes scatter {
    0%, 18% { opacity: 0; transform: translate(-12px, -28px); }
    25% { opacity: 1; }
    48%, 85% { opacity: 1; transform: none; }
    100% { opacity: 0; transform: none; }
  }
  @keyframes impact {
    0%, 40%, 65%, 100% { opacity: 0; }
    46%, 55% { opacity: 1; }
  }
  @keyframes vase-toss {
    0%, 13% { opacity: 1; transform: translate(-5px, 0) rotate(-15deg); }
    21% { opacity: 1; transform: translate(12px, -22px) rotate(40deg); }
    32% { opacity: 1; transform: translate(35px, -32px) rotate(160deg); }
    44% { opacity: 1; transform: translate(53px, 18px) rotate(300deg); }
    45%, 100% { opacity: 0; transform: translate(53px, 18px) rotate(300deg); }
  }
  @keyframes shatter {
    0%, 44% { opacity: 0; transform: translate(0, 0); }
    45% { opacity: 1; transform: translate(0, 0); }
    60%, 88% { opacity: 1; transform: translate(2px, 0); }
    100% { opacity: 0; transform: translate(2px, 0); }
  }
  @keyframes shard-scatter {
    0%, 45% { transform: translate(10px, 0); }
    60%, 100% { transform: none; }
  }
  @keyframes shard-scatter-right {
    0%, 45% { transform: translate(-2px, 0); }
    60%, 100% { transform: none; }
  }
  @keyframes shard-scatter-far {
    0%, 45% { transform: translate(-10px, 0); }
    60%, 100% { transform: none; }
  }
  @keyframes saw-duck {
    0%, 8%, 100% { transform: none; }
    16% { transform: translateX(-5px) rotate(-9deg); }
    24%, 36%, 48% { transform: translate(4px, -1px) rotate(4deg); }
    30%, 42%, 54% { transform: translate(1px, 1px) rotate(-3deg); }
    65%, 90% { transform: none; }
  }
  @keyframes saw-wing {
    0%, 100% { opacity: 0; }
    8%, 65% { opacity: 1; transform: rotate(-8deg); }
    75% { opacity: 0; }
  }
  @keyframes saw-cut {
    0% { opacity: 0; transform: translate(-5px, -12px) rotate(-20deg); }
    8%, 18% { opacity: 1; transform: translate(-5px, -12px) rotate(-20deg); }
    25%, 35% { opacity: 1; transform: translate(7px, -3px) rotate(5deg); }
    48%, 55% { opacity: 1; transform: translate(7px, 14px) rotate(5deg); }
    70% { opacity: 0; transform: translate(-4px, -3px); }
    100% { opacity: 0; }
  }
  @keyframes cut-left {
    0%, 54% { opacity: 1; transform: none; }
    68%, 88% { opacity: 1; transform: translate(-5px, 4px) rotate(-16deg); }
    100% { opacity: 0; transform: translate(-5px, 4px) rotate(-16deg); }
  }
  @keyframes cut-right {
    0%, 54% { opacity: 1; transform: none; }
    68%, 88% { opacity: 1; transform: translate(8px, 4px) rotate(22deg); }
    100% { opacity: 0; transform: translate(8px, 4px) rotate(22deg); }
  }
  @keyframes chips {
    0%, 24%, 58%, 100% { opacity: 0; }
    28%, 48% { opacity: 1; }
  }

  /* faint: swoons onto its back with its feet in the air, X eyes, stars circle the head.
     The X eye is drawn as a "+" because the final -134deg rotation turns it into an X. */
  body[data-pose="faint"] #root { transform-origin: 59px 80px; animation: faint-fall 1s cubic-bezier(.45, 0, .7, 1) forwards; }
  @keyframes faint-fall { 0% { transform: translate(0, 0) rotate(0); } 30% { transform: translate(-3px, -6px) rotate(-30deg); }
    62% { transform: translate(-4px, 0) rotate(-146deg); } 80% { transform: translate(-2px, -4px) rotate(-126deg); }
    100% { transform: translate(-2px, 1px) rotate(-134deg); } }
  body[data-pose="faint"] .props { opacity: 1; }
  body[data-pose="faint"] .eye-open { opacity: 0; }
  body[data-pose="faint"] .eye-wide { animation: faint-wide 1s steps(1, end) forwards; }
  body[data-pose="faint"] .eye-x { animation: faint-x 1s steps(1, end) forwards; }
  @keyframes faint-wide { 0% { opacity: 1; } 55%, 100% { opacity: 0; } }
  @keyframes faint-x { 0%, 54% { opacity: 0; } 55%, 100% { opacity: 1; } }
  body[data-pose="faint"] #tail { transform: rotate(-90deg); transition: transform .45s ease; }
  body[data-pose="faint"] #wing { transform: rotate(48deg); }
  body[data-pose="faint"] #lower-beak { transform: rotate(16deg); }
  body[data-pose="faint"] .stars { opacity: 1; transition-delay: .7s; }
  .stars .orbit { transform-origin: 11px 60px; animation: orbit 2.4s linear infinite; }
  .stars path { fill: #f2c14e; stroke: #c99a2a; stroke-width: .8; stroke-linejoin: round; }
  @keyframes orbit { to { transform: rotate(360deg); } }

  #bubble { position: absolute; left: 0; bottom: 112px; max-width: 250px; box-sizing: border-box;
    padding: 8px 12px 9px; border-radius: 14px; background: #fffdf6; border: 1.5px solid #cbbd98; color: #55666e;
    font: italic 13px/1.35 Georgia, "Times New Roman", serif; box-shadow: 0 4px 14px rgba(70, 60, 30, .16);
    opacity: 0; pointer-events: none; transition: opacity .25s; }
  #bubble.show { opacity: 1; }
  #said { white-space: pre-line; }
  #chips { margin-top: 7px; }
  #chips:empty { display: none; }
  #chips .row { display: flex; flex-wrap: wrap; gap: 5px; }
  #chips .row + .row { margin-top: 5px; }
  .chip { appearance: none; margin: 0; font: 600 11px/1.2 -apple-system, "Helvetica Neue", Arial, sans-serif; padding: 4px 9px 5px;
    border-radius: 999px; border: 1.5px solid #cbbd98; background: #fff; color: #55666e; white-space: nowrap; cursor: pointer;
    pointer-events: none; transition: background .12s, border-color .12s, transform .12s; }
  #bubble.show .chip { pointer-events: auto; }
  .chip.yield { background: #f6dd8b; border-color: #c9a93f; color: #62500f; }
  .chip.decline { background: transparent; border-style: dashed; color: #7d8d95; }
  .chip:hover, .chip.hover { background: #f3ead0; border-color: #a99556; transform: translateY(-1px); }
  .chip.yield:hover, .chip.yield.hover { background: #f1cf62; border-color: #b8982f; }
  #bubble::after { content: ""; position: absolute; bottom: -7px; left: var(--tail, 50%); width: 11px; height: 11px;
    background: #fffdf6; border-right: 1.5px solid #cbbd98; border-bottom: 1.5px solid #cbbd98;
    transform: translateX(-50%) rotate(45deg); }

  /* Focus sprint clock. It sits beside the duck, never over the bubble, and ignores the mouse. */
  #timer { position: absolute; bottom: 24px; left: 198px; width: 72px; box-sizing: border-box; padding: 5px 8px 7px;
    border-radius: 12px; background: #fffdf6; border: 1.5px solid #cbbd98; color: #55666e; text-align: center;
    font: 600 12px/1 ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; letter-spacing: .02em;
    box-shadow: 0 3px 10px rgba(70, 60, 30, .14); opacity: 0; transform: translateY(4px) scale(.94);
    transition: opacity .25s, transform .25s, border-color .6s, color .6s; pointer-events: none; }
  #timer.show { opacity: 1; transform: none; }
  #timer .track { display: block; height: 3px; margin-top: 5px; border-radius: 2px; background: #eadfc0; overflow: hidden; }
  #timer .fill { display: block; height: 100%; background: #8fb7a0; transform-origin: left center;
    transform: scaleX(var(--p, 1)); transition: transform 1s linear, background .6s; }
  #timer.late { color: #9a6a1d; border-color: #d9b45e; }
  #timer.late .fill { background: #e0a53a; }
  #timer.late .clock { animation: clock-pulse 1s ease-in-out infinite; }
  @keyframes clock-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .72; } }

  @media (prefers-reduced-motion: reduce) {
    body[data-pose] #root, body[data-act] #act, .zzz text, .stars .orbit, #timer.late .clock, .band-tails { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
    body[data-act] .flip-prop, body[data-act] .flip-prop path { animation: none !important; }

<div id="bubble" role="status"><div id="said"></div><div id="chips"></div></div>
<div id="timer" aria-hidden="true"><span class="clock">00:00</span><i class="track"><b class="fill"></b></i></div>
<script src="lines.js"></script>
<script src="voice.js"></script>
<script>
  const body = document.body, bubble = document.getElementById("bubble");
  const said = document.getElementById("said"), chipBox = document.getElementById("chips");
  const timerBox = document.getElementById("timer"), clockEl = timerBox.querySelector(".clock");
  const lines = globalThis.DUCK_LINES, Voice = globalThis.DuckVoice;
  const voice = Voice.createVoice({ lines });
  const debate = Voice.createDebate({ lines, draw: voice.draw });
  let actTimer, bubbleTimer, faintTimer;
  let sticky = null; // text of a bubble that stays until something replaces it
  let turn = null; // the debate turn on screen, or null when no debate is running
  let place = { min: 0, max: 280 }; // the part of the window where the bubble may sit
  let sprint = null; // { endsAt, total } while a focus sprint runs
  let timerTick;
  const DUCK_LEFT = 96, DUCK_RIGHT = 192, TIMER_W = 72, TIMER_GAP = 4; // DUCK_* match duckRect in Duck.swift
  const actMs = { hop: 1200, land: 520, happy: 1700, quack: 1500, preen: 2700, look: 2900, yawn: 2500, wiggle: 1700,
    sneeze: 1800, spin: 1600, bow: 1900, shake: 1300, deskflip: 2600, vasetoss: 2600, chainsaw: 2600 };
  function notify(message) {
    try { window.webkit.messageHandlers.duck.postMessage(message); } catch { /* running in a plain browser */ }
  }
  function reportBubble() {
    if (!bubble.classList.contains("show")) return notify({ t: "bubble", rect: null, chips: [] });
    const r = bubble.getBoundingClientRect();
    const chips = [...chipBox.querySelectorAll(".chip")].map((el) => {
      const c = el.getBoundingClientRect();
      return { id: el.dataset.id, x: c.left, y: c.top, w: c.width, h: c.height };
    });
    notify({ t: "bubble", rect: { x: r.left, y: r.top, w: r.width, h: r.height }, chips });
  }
  function setPlace(visMin = 0, visMax = 280) {
    place = { min: Math.max(visMin, 0), max: Math.min(visMax, 280) };
    placeTimer();
  }
  // The clock goes on the side of the duck with more room on screen.
  function placeTimer() {
    const roomRight = place.max - (DUCK_RIGHT + TIMER_GAP);
    const roomLeft = DUCK_LEFT - TIMER_GAP - place.min;
    const right = roomRight >= TIMER_W || roomRight >= roomLeft;
    timerBox.style.left = (right ? DUCK_RIGHT + TIMER_GAP : DUCK_LEFT - TIMER_GAP - TIMER_W) + "px";
  }
  // Shows the time left from the wall clock, so sleep or a slow page can never make it drift.
  // It repaints once per displayed second, and the final 0:00 stays until sprintStop().
  function paintTimer() {
    clearTimeout(timerTick);
    if (!sprint) return;
    const left = sprint.endsAt - Date.now();
    const secs = Math.max(0, Math.ceil(left / 1000));
    clockEl.textContent = Voice.formatClock(secs);
    timerBox.style.setProperty("--p", String(Math.min(1, Math.max(0, left / sprint.total))));
    timerBox.classList.toggle("late", secs <= 60);
    if (left > 0) timerTick = setTimeout(paintTimer, (left % 1000) + 15);
  }
  function layout() {
    bubble.style.maxWidth = Math.max(120, Math.min(250, place.max - place.min - 16)) + "px";
    bubble.style.left = "0px";
    const w = bubble.getBoundingClientRect().width;
    const centre = 140;
    const left = Math.min(Math.max(centre - w / 2, place.min + 8), Math.max(place.min + 8, place.max - 8 - w));
    bubble.style.left = left + "px";
    bubble.style.setProperty("--tail", Math.min(Math.max(centre - left, 16), w - 16) + "px");
  }
  function renderChips(chips) {
    chipBox.replaceChildren();
    for (const group of [chips.filter((c) => c.kind === "excuse"), chips.filter((c) => c.kind !== "excuse")]) {
      if (!group.length) continue;
      const row = document.createElement("div");
      row.className = "row";
      for (const c of group) {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "chip " + c.kind;
        el.dataset.id = c.id;
        el.textContent = c.label;
        row.append(el);
      }
      chipBox.append(row);
    }
  }
  // ms > 0 hides the bubble after that long; ms === 0 leaves it until something replaces it.
  function present(text, ms, chips = []) {
    clearTimeout(bubbleTimer);
    said.textContent = text;
    renderChips(chips);
    layout();
    bubble.classList.add("show");
    requestAnimationFrame(reportBubble);
    if (ms > 0) bubbleTimer = setTimeout(() => window.duck.hush(), ms);
  }
  function stopDebate() {
    clearTimeout(faintTimer);
    debate.stop();
    turn = null;
  }
  function showTurn(t) {
    clearTimeout(faintTimer);
    window.duck.base(t.pose);
    if (t.act) window.duck.play(t.act);
    sticky = null;
    present(t.text, t.ms || 0, t.chips);
    if (t.end) {
      turn = null;
      if (t.end === "won") voice.startDuty();
      notify({ t: "debate", event: "end", outcome: t.end });
      return;
    }
    turn = t;
    notify({ t: "debate", event: "turn", final: Boolean(t.autoWinMs) });
    if (t.autoWinMs) {
      faintTimer = setTimeout(() => {
        const win = debate.timeout();
        if (win) showTurn(win);
      }, t.autoWinMs);
    }
  }
  chipBox.addEventListener("click", (event) => {
    const chip = event.target.closest(".chip");
    if (chip) window.duck.pick(chip.dataset.id);
  });
  window.duck = {
    base(pose) { body.dataset.pose = pose; },
    face(dir) { body.dataset.dir = dir < 0 ? "-1" : "1"; },
    play(name) {
      clearTimeout(actTimer);
      delete body.dataset.act;
      void body.offsetWidth;
      body.dataset.act = name;
      actTimer = setTimeout(() => { delete body.dataset.act; }, actMs[name] ?? 1500);
    },
    say(text, ms = 0, visMin = 0, visMax = 280) {
      stopDebate();
      setPlace(visMin, visMax);
      sticky = ms > 0 ? null : text;
      present(text, ms);
    },
    // Speak a line from the voice. o: { minX, maxX, ms, win, awayMin, early, text }.
    // Returns { text, ms, act? } so the caller knows how long the bubble stays, or null for an unknown kind.
    cue(kind, o = {}) {
      const c = voice.cue(kind, o);
      if (!c) return null;
      stopDebate();
      if (o.minX !== undefined) setPlace(o.minX, o.maxX);
      if (c.act) window.duck.play(c.act);
      sticky = c.ms > 0 ? null : c.text;
      present(c.text, c.ms);
      return c;
    },
    // Put back what was on screen before a drag hid it.
    restore(visMin, visMax) {
      if (visMin !== undefined) setPlace(visMin, visMax);
      if (turn) {
        window.duck.base(turn.pose);
        present(turn.text, 0, turn.chips);
      } else if (sticky) {
        present(sticky, 0);
      }
    },
    // keep: hide the bubble but remember it, so restore() can bring it back.
    hush(keep = false) {
      clearTimeout(bubbleTimer);
      if (!keep) {
        sticky = null;
        stopDebate();
      }
      bubble.classList.remove("show");
      notify({ t: "bubble", rect: null, chips: [] });
    },
    debateStart(visMin, visMax) {
      stopDebate();
      sticky = null;
      if (visMin !== undefined) setPlace(visMin, visMax);
      showTurn(debate.open());
    },
    pick(id) {
      if (!turn) return false;
      const next = debate.pick(id);
      if (!next) return false;
      showTurn(next);
      return true;
    },
    hover(id) {
      for (const el of chipBox.querySelectorAll(".chip")) el.classList.toggle("hover", el.dataset.id === id);
    },
    debateStop() { stopDebate(); },
    // Show the sprint clock. endsAt is epoch milliseconds and totalMs is the full length, for the bar.
    // Call it again to move the end time. The page never ends the sprint itself; Swift does.
    sprintStart(endsAt, totalMs, visMin, visMax) {
      if (!Number.isFinite(endsAt)) return;
      sprint = { endsAt, total: totalMs > 0 ? totalMs : Math.max(1, endsAt - Date.now()) };
      if (visMin !== undefined) setPlace(visMin, visMax);
      else placeTimer();
      paintTimer();
      timerBox.classList.add("show");
    },
    sprintStop() {
      clearTimeout(timerTick);
      sprint = null;
      timerBox.classList.remove("show", "late");
    },
  };
  new URLSearchParams(location.search).forEach((value, key) => {
    if (key === "pose") duck.base(value);
    if (key === "act") duck.play(value);
    if (key === "dir") duck.face(Number(value));
    if (key === "say") duck.say(value, 0);
    if (key === "cue") duck.cue(value, { ms: 0, n: 25 });
    if (key === "debate") duck.debateStart();
    if (key === "sprint") duck.sprintStart(Date.now() + Number(value) * 1000, Number(value) * 1000);
  });
</script>
